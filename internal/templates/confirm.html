{{if eq .Decision "approved"}}
  <div style="padding: 48px 28px; text-align: center;">
    <div style="
      width: 64px; height: 64px; border-radius: 50%;
      background: #f0fdf4; color: #16a34a;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; margin: 0 auto 24px;
    ">✓</div>
    <h1 style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px;">
      Thank you! Your approval has been sent.
    </h1>
    <p style="color: #64748b; font-size: 14px; line-height: 1.5;">
      You can close this window now.
    </p>
  </div>
{{else}}
  <div style="padding: 48px 28px; text-align: center;">
    <div style="
      width: 64px; height: 64px; border-radius: 50%;
      background: #fef2f2; color: #dc2626;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; margin: 0 auto 24px;
    ">✕</div>
    <h1 style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px;">
      Noted. The request has been rejected.
    </h1>
    <p style="color: #64748b; font-size: 14px; line-height: 1.5;">
      You can close this window now.
    </p>
  </div>
{{end}}
