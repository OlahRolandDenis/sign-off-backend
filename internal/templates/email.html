<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>Approval Required</title>
</head>
<body style="margin:0; padding:0; background-color:#fafafa;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#fafafa" style="background-color:#fafafa;">
    <tr>
      <td align="center" style="padding: 40px 16px;">

        <!-- Brand row -->
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin-bottom: 28px;">
          <tr>
            <td valign="middle" style="padding-right: 8px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td bgcolor="#0f172a" width="24" height="24" align="center" valign="middle" style="
                    background-color: #0f172a;
                    border-radius: 6px;
                    color: #ffffff;
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
                    font-size: 13px;
                    font-weight: 700;
                    line-height: 24px;
                  ">&#10003;</td>
                </tr>
              </table>
            </td>
            <td valign="middle">
              <span style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; color: #0f172a; letter-spacing: -0.01em;">Signoff</span>
            </td>
          </tr>
        </table>

        <!-- Main card -->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#ffffff" style="max-width: 560px; background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px;">

          <!-- Badge -->
          <tr>
            <td style="padding: 28px 28px 0;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td bgcolor="#ffffff" style="
                    background-color: #ffffff;
                    border: 1px solid #e2e8f0;
                    border-radius: 20px;
                    padding: 6px 14px;
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
                    font-size: 11px;
                    font-weight: 700;
                    color: #64748b;
                    text-transform: uppercase;
                    letter-spacing: 0.06em;
                  ">Approval Required</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Title + subtitle -->
          <tr>
            <td style="padding: 16px 28px 20px; border-bottom: 1px solid #e2e8f0;">
              <p style="margin:0 0 6px 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; color: #64748b; line-height: 1.5;">
                Someone requested your approval on the following.
              </p>
              <h1 style="margin:0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 800; color: #0f172a; letter-spacing: -0.02em; line-height: 1.3;">
                {{.Title}}
              </h1>
            </td>
          </tr>

          <!-- Content label -->
          <tr>
            <td style="padding: 20px 28px 8px;">
              <span style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #64748b;">
                Content to review
              </span>
            </td>
          </tr>

          <!-- Content box -->
          <tr>
            <td style="padding: 0 28px 24px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#f8fafc" style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px;">
                <tr>
                  <td style="padding: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; line-height: 1.7; color: #334155;">
                    {{.Content}}
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Single button - takes client to the decision page -->
          <tr>
            <td style="padding: 0 28px 28px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td bgcolor="#0f172a" align="center" style="border-radius: 10px; background-color: #0f172a;">
                    <a href="{{.ApprovalURL}}" target="_blank" style="
                      display: block;
                      padding: 14px 16px;
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
                      font-size: 15px;
                      font-weight: 700;
                      color: #ffffff;
                      text-decoration: none;
                      letter-spacing: -0.01em;
                    ">Review &amp; Decide &rarr;</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Fallback link + expiry -->
          <tr>
            <td style="padding: 16px 28px 24px; border-top: 1px solid #e2e8f0;">
              <p style="margin:0 0 8px 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; color: #94a3b8; line-height: 1.5;">
               This link expires in 48 hours.
If you have questions, use the button above to leave a comment.
              </p>
            </td>
          </tr>

        </table>

        <!-- Footer -->
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin-top: 24px;">
          <tr>
            <td align="center">
              <p style="margin:0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; color: #94a3b8;">
                Powered by Signoff
              </p>
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>
</html>
