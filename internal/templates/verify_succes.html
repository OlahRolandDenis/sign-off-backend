<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verified</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
        }
        .icon {
            font-size: 56px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }
        p {
            color: #475569;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background: #0f172a;
            color: white;
            padding: 14px 32px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: opacity 0.15s;
        }
        .btn:hover { opacity: 0.85; }
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            margin-bottom: 12px;
        }
        .brand-icon {
            width: 24px;
            height: 24px;
            background: #0f172a;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 13px;
            font-weight: 700;
        }
        .brand-name {
            font-weight: 700;
            font-size: 15px;
            letter-spacing: -0.01em;
            color: #0f172a;
        }
        .footer-note {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand">
            <div class="brand-icon">✓</div>
            <span class="brand-name">NodGo</span>
        </div>
        <div class="icon">✅</div>
        <h1>Email Verified</h1>
        <p>Your account is now active. You can now log in and start using NodGo.</p>
        <a href="https://nodgo.app/login" class="btn">Go to Login →</a>
    </div>

    <div class="footer-note">Powered by NodGo</div>

</body>
</html>
