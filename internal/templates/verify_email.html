<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Verify your email</title>
</head>
<body style="margin:0;padding:0;background-color:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" bgcolor="#fafafa">
        <tr>
            <td align="center" style="padding:40px 16px;">
                <table cellpadding="0" cellspacing="0" bgcolor="#ffffff" style="max-width:560px;border-radius:16px;border:1px solid #e2e8f0;">
                    <tr>
                        <td style="padding:28px 32px;">
                            <h1 style="font-size:24px;font-weight:800;color:#0f172a;margin:0 0 8px;">📧 Verify your email</h1>
                            <p style="font-size:16px;color:#475569;margin:0 0 24px;">Welcome to NodGo! Please confirm your email address to start using the platform.</p>
                            <table width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td align="center" bgcolor="#0f172a" style="border-radius:8px;">
                                        <a href="{{.VerificationURL}}" target="_blank" style="display:block;padding:14px 16px;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;">
                                            Verify Email →
                                        </a>
                                    </td>
                                </tr>
                            </table>
                            <p style="font-size:14px;color:#94a3b8;margin:24px 0 0;">If you didn't create an account, you can safely ignore this email.</p>
                            <hr style="border-top:1px solid #e2e8f0;margin:24px 0;">
                            <p style="font-size:12px;color:#94a3b8;margin:0;text-align:center;">Powered by NodGo</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
