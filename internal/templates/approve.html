<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Approval Required</title>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --black: #0f172a;
      --gray: #64748b;
      --light-gray: #f8fafc;
      --border: #e2e8f0;
      --green: #16a34a;
      --green-light: #f0fdf4;
      --red: #dc2626;
      --red-light: #fef2f2;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fafafa;
      color: var(--black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* Header brand, minimal, same as landing page */
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 32px;
    }
    .brand-icon {
      width: 24px;
      height: 24px;
      background: var(--black);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 13px;
    }
    .brand-name {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.01em;
    }

    /* Badge, matches hero badge styling */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--gray);
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Main card */
    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 560px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
    }

    .card-header {
      padding: 28px 28px 20px;
      border-bottom: 1px solid var(--border);
    }

    .card-header h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }

    .content-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--gray);
      padding: 20px 28px 8px;
    }

    .content-box {
      margin: 0 28px 20px;
      background: var(--light-gray);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      font-size: 14px;
      line-height: 1.7;
      color: #334155;
      white-space: pre-wrap;
      max-height: 320px;
      overflow-y: auto;
    }

    .comment-section {
      padding: 0 28px 20px;
    }
    .comment-section label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--gray);
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      font-family: inherit;
      color: var(--black);
      resize: vertical;
      min-height: 72px;
      background: var(--light-gray);
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    textarea:focus {
      border-color: var(--black);
      background: white;
    }

    .actions {
      display: flex;
      gap: 10px;
      padding: 20px 28px 28px;
    }

    .btn {
      flex: 1;
      padding: 13px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      letter-spacing: -0.01em;
      transition: opacity 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-approve {
      background: var(--black);
      color: white;
    }
    .btn-approve:hover:not(:disabled) { opacity: 0.85; }

    .btn-reject {
      background: white;
      color: var(--black);
      border: 1px solid var(--border);
    }
    .btn-reject:hover:not(:disabled) { background: var(--light-gray); }

    .loading {
      display: none;
      text-align: center;
      padding: 28px;
      color: var(--gray);
      font-size: 14px;
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--black);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .htmx-request .actions { display: none; }
    .htmx-request .loading { display: block; }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      margin-top: 24px;
    }

    @media (max-width: 420px) {
      .actions { flex-direction: column-reverse; }
    }
  </style>
</head>
<body>

  <div class="brand">
    <div class="brand-icon">✓</div>
    <div class="brand-name">Signoff</div>
  </div>

  <div class="badge">Approval Required</div>

  <div class="card" id="card">
    <div class="card-header">
      <h1>{{.Title}}</h1>
    </div>

    <div class="content-label">Content to review</div>
    <div class="content-box">{{.Content}}</div>

    <div class="comment-section">
      <label for="comment">Add a comment (optional)</label>
      <textarea id="comment" name="comment" rows="3"
        placeholder="Any feedback or notes…"></textarea>
    </div>

    <div class="actions" id="actions">
      <button
        class="btn btn-reject"
        hx-post="/approve/{{.Token}}/decision"
        hx-include="#comment"
        hx-vals='{"decision": "rejected"}'
        hx-target="#card"
        hx-swap="innerHTML">
        ✕ Reject
      </button>
      <button
        class="btn btn-approve"
        hx-post="/approve/{{.Token}}/decision"
        hx-include="#comment"
        hx-vals='{"decision": "approved"}'
        hx-target="#card"
        hx-swap="innerHTML">
        ✓ Approve
      </button>
    </div>

    <div class="loading">
      <span class="spinner"></span> Sending your decision…
    </div>
  </div>

  <div class="footer-note">Powered by Signoff</div>

</body>
</html>
